name: ✨ Feature
description: A worked-out feature, ready to plan. For a quick thought, use Idea.
title: "[Feature]: "
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      placeholder: Players lose progress when the game crashes.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should it do?
      placeholder: Autosave every 5 minutes and on every level change.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How do we know it's done?
      placeholder: |
        - Progress is restored after a crash
        - The player sees an autosave icon
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, references, links.
